name: Native 7-Zip compact distribution test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/test-native-7z.yml"

permissions:
  contents: read
  actions: read

jobs:
  native-7z:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification libraries and locate native 7-Zip
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "PyMuPDF==2.1" python-docx striprtf pillow tkinterdnd2 pytesseract openpyxl python-pptx
          $seven = Join-Path $env:ProgramFiles "7-Zip/7z.exe"
          if (!(Test-Path $seven)) {
            $command = Get-Command 7z.exe -ErrorAction SilentlyContinue
            if ($command) { $seven = $command.Source }
            else {
              choco install 7zip --no-progress -y
              $seven = (Get-Command 7z.exe -ErrorAction Stop).Source
            }
          }
          Write-Host "Native 7-Zip: $seven"
          "SEVENZIP_EXE=$seven" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download the exact verified v1.11.0 distribution
        uses: actions/download-artifact@v4
        with:
          name: ספריית-המתכונים-שלי-Windows-כולל-Office
          path: source-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: 42487779118

      - name: Extract the original EXE and complete LibreOffice runtime
        shell: pwsh
        run: |
          $outer = Get-ChildItem source-artifact -Filter "*.zip" -File | Select-Object -First 1
          if (!$outer) { throw "Verified v1.11.0 package missing" }
          $unpacked = Join-Path (Get-Location) "source-package"
          Expand-Archive -LiteralPath $outer.FullName -DestinationPath $unpacked -Force
          $exe = Join-Path $unpacked "ספריית_המתכונים_שלי.exe"
          $officeZip = Join-Path $unpacked "LibreOffice.zip"
          if (!(Test-Path $exe) -or !(Test-Path $officeZip)) { throw "Original EXE or LibreOffice.zip missing" }
          $root = Join-Path (Get-Location) "package-root"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          Copy-Item $exe $root
          $lo = Join-Path $root "LibreOffice"
          New-Item -ItemType Directory -Force -Path $lo | Out-Null
          Expand-Archive -LiteralPath $officeZip -DestinationPath $lo -Force
          if (!(Test-Path (Join-Path $lo "program/soffice.exe"))) { throw "LibreOffice extraction failed" }
          @'
          הפעלת ספריית המתכונים שלי
          חלצו את כל תוכן קובץ 7z לתיקייה אחת והפעילו את ספריית_המתכונים_שלי.exe.
          '@ | Set-Content -Encoding UTF8 (Join-Path $root "קראו-לפני-הפעלה.txt")
          Write-Host "Original EXE bytes: $((Get-Item $exe).Length)"

      - name: Remove only LibreOffice UI extras not used by the app
        shell: pwsh
        run: |
          # The released app uses LibreOffice only as a headless format converter.
          # Keep the complete program/ engine and conversion filters. Remove editor-only
          # help pages, clip-art gallery, default templates, and language/UI extensions.
          $officeRoot = Join-Path (Get-Location) "package-root/LibreOffice"
          foreach ($relative in @("help", "share/gallery", "share/template", "share/extensions")) {
            $candidate = Join-Path $officeRoot $relative
            if (Test-Path $candidate) {
              $bytes = (Get-ChildItem -LiteralPath $candidate -Recurse -File | Measure-Object -Property Length -Sum).Sum
              Remove-Item -LiteralPath $candidate -Recurse -Force
              Write-Host "Removed optional resource $relative : $bytes bytes"
            }
          }
          if (!(Test-Path (Join-Path $officeRoot "program/soffice.exe"))) { throw "Required Office executable was removed" }

      - name: Create one solid archive and verify extraction and Office conversions
        shell: pwsh
        run: |
          @'
          import hashlib, json, os, shutil, subprocess, sys, time
          from pathlib import Path
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")
          from docx import Document
          import openpyxl
          from pptx import Presentation

          root = Path("package-root").resolve()
          output = Path("native-7z-output").resolve()
          output.mkdir(exist_ok=True)
          seven = os.environ["SEVENZIP_EXE"]
          exe_name = "ספריית_המתכונים_שלי.exe"
          source_exe = root / exe_name
          source_office = root / "LibreOffice"
          if not source_exe.is_file() or not (source_office / "program" / "soffice.exe").is_file():
              raise SystemExit("Candidate executable or Office engine missing.")

          docs = output / "sample-documents"
          docs.mkdir(exist_ok=True)
          d = Document(); d.add_heading("Word conversion validation", 1); d.add_paragraph("Sample text for PDF export."); d.save(docs / "sample.docx")
          w = openpyxl.Workbook(); w.active["A1"] = "Excel conversion validation"; w.save(docs / "sample.xlsx")
          p = Presentation(); slide = p.slides.add_slide(p.slide_layouts[6]); slide.shapes.add_textbox(500000, 500000, 7000000, 1000000).text = "PowerPoint conversion validation"; p.save(docs / "sample.pptx")

          archive = output / "ספריית-המתכונים-שלי-קומפקטית.7z"
          command = [seven, "a", "-t7z", "-mx=9", "-m0=LZMA2", "-ms=on", "-mmt=on", "-mfb=273", "-md=64m", "-y", str(archive), "*", "-r"]
          started = time.time()
          proc = subprocess.run(command, cwd=root, capture_output=True, text=True, encoding="utf-8", errors="replace")
          if proc.returncode != 0:
              raise RuntimeError("7-Zip create failed:\n" + (proc.stdout + "\n" + proc.stderr)[-5000:])
          compress_seconds = round(time.time() - started, 1)
          size = archive.stat().st_size
          print(f"NATIVE 7Z SIZE: {size:,} bytes = {size/1_000_000:.2f} MB; under 300MB={size <= 300_000_000}", flush=True)

          test = subprocess.run([seven, "t", str(archive)], capture_output=True, text=True, encoding="utf-8", errors="replace")
          if test.returncode != 0 or "Everything is Ok" not in (test.stdout + test.stderr):
              raise RuntimeError("7-Zip integrity test failed:\n" + (test.stdout + "\n" + test.stderr)[-5000:])

          extracted = output / "extracted"
          shutil.rmtree(extracted, ignore_errors=True)
          extracted.mkdir()
          extraction = subprocess.run([seven, "x", "-y", f"-o{extracted}", str(archive)], capture_output=True, text=True, encoding="utf-8", errors="replace")
          if extraction.returncode != 0:
              raise RuntimeError("7-Zip extraction failed:\n" + (extraction.stdout + "\n" + extraction.stderr)[-5000:])

          def file_map(folder):
              return {p.relative_to(folder).as_posix(): p for p in folder.rglob("*") if p.is_file()}
          original, restored = file_map(root), file_map(extracted)
          if set(original) != set(restored):
              raise RuntimeError(f"File list mismatch: missing={sorted(set(original)-set(restored))[:10]}, extra={sorted(set(restored)-set(original))[:10]}")
          def sha(path):
              digest=hashlib.sha256()
              with path.open("rb") as stream:
                  for block in iter(lambda: stream.read(4*1024*1024), b""): digest.update(block)
              return digest.hexdigest()
          for relative, source in original.items():
              target=restored[relative]
              if source.stat().st_size != target.stat().st_size or sha(source) != sha(target):
                  raise RuntimeError(f"7-Zip extraction changed file bytes: {relative}")
          print(f"7-Zip extraction verified: {len(original)} files have identical SHA256.", flush=True)

          sys.path.insert(0, str(Path("src").resolve()))
          import ספריית_המתכונים as app
          old_executable=sys.executable
          had_frozen=hasattr(sys,"frozen")
          old_frozen=getattr(sys,"frozen",None)
          try:
              app_exe=extracted/exe_name
              os.environ["LOCALAPPDATA"]=str(output/"isolated-local-appdata")
              sys.executable=str(app_exe.resolve())
              sys.frozen=True
              engine=app.find_libreoffice()
              if engine is None or not engine.is_file():
                  raise RuntimeError("App cannot discover its bundled LibreOffice.")
              conversions=[]
              for sample in sorted(docs.iterdir()):
                  pdf,temp_dir,error=app.convert_office_to_pdf(sample)
                  if error or pdf is None or not pdf.is_file():
                      raise RuntimeError(f"{sample.suffix} to PDF failed: {error}")
                  try:
                      with app.fitz.open(pdf) as result:
                          if result.page_count<1: raise RuntimeError(f"{sample.suffix} generated an empty PDF")
                          conversions.append(f"{sample.suffix.upper()} -> PDF ({result.page_count} page)")
                  finally:
                      if temp_dir: shutil.rmtree(temp_dir,ignore_errors=True)
              print("Application Office conversions:", ", ".join(conversions), flush=True)
          finally:
              sys.executable=old_executable
              if had_frozen: sys.frozen=old_frozen
              elif hasattr(sys,"frozen"): del sys.frozen

          report={
              "original_exe_preserved":True,
              "exe_bytes":source_exe.stat().st_size,
              "archive_bytes":size,
              "archive_decimal_mb":round(size/1_000_000,2),
              "under_300mb":size<=300_000_000,
              "solid_lzma2":True,
              "file_count":len(original),
              "all_extracted_file_hashes_identical":True,
              "office_conversions":conversions,
              "compression_seconds":compress_seconds,
              "optional_dirs_removed":["help","share/gallery","share/template","share/extensions"]
          }
          (output/"compact-report.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print("FINAL REPORT:",json.dumps(report,ensure_ascii=False),flush=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Native 7-Zip candidate validation failed" }

      - name: Verify the released application opens from the extracted candidate
        shell: pwsh
        run: |
          $exe = Resolve-Path "native-7z-output/extracted/ספריית_המתכונים_שלי.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $p.Refresh()
          if ($p.HasExited) { throw "Application exited during startup after extraction" }
          taskkill /PID $p.Id /T /F | Out-Null

      - name: Upload the single-file compact candidate and report
        uses: actions/upload-artifact@v4
        with:
          name: native-7z-compact-candidate
          path: |
            native-7z-output/ספריית-המתכונים-שלי-קומפקטית.7z
            native-7z-output/compact-report.json
          if-no-files-found: error
          retention-days: 30
