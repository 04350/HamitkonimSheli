name: בניית התוכנה למחשב

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build-windows.yml'
      - 'tests/**'
      - 'assets/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: הורדת קובצי הפרויקט
        uses: actions/checkout@v4

      - name: התקנת סביבת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות הדרושות לבנייה
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF python-docx striprtf pillow tkinterdnd2 pytesseract openpyxl python-pptx pyinstaller
          choco install tesseract --no-progress -y
          choco install libreoffice-still --no-progress -y
          $loSource = Join-Path $env:ProgramFiles 'LibreOffice'
          if (!(Test-Path (Join-Path $loSource 'program/soffice.exe'))) {
            $loSource = Join-Path ${env:ProgramFiles(x86)} 'LibreOffice'
          }
          if (!(Test-Path (Join-Path $loSource 'program/soffice.exe'))) {
            throw 'LibreOffice was not installed in the expected location'
          }
          Write-Host "LibreOffice engine found at $loSource"
          New-Item -ItemType Directory -Force -Path tesseract/tessdata | Out-Null
          Copy-Item 'C:\Program Files\Tesseract-OCR\tesseract.exe' tesseract/
          Copy-Item 'C:\Program Files\Tesseract-OCR\*.dll' tesseract/ -ErrorAction SilentlyContinue
          Copy-Item 'C:\Program Files\Tesseract-OCR\tessdata\eng.traineddata' tesseract/tessdata/
          Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tessdata_fast/raw/main/heb.traineddata' -OutFile 'tesseract/tessdata/heb.traineddata'

      - name: בדיקת מנוע OCR בעברית ובאנגלית
        shell: pwsh
        run: |
          @'
          import sys
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          sys.path.insert(0, "src")
          import ספריית_המתכונים as app

          root = Path("tesseract").resolve()
          for required in ("eng.traineddata", "heb.traineddata"):
              data_file = root / "tessdata" / required
              if not data_file.exists() or data_file.stat().st_size < 100_000:
                  raise SystemExit(f"Missing or invalid language data: {data_file}")
          if not app.configure_ocr():
              raise SystemExit("Tesseract was not found by the application")
          languages = set(app.pytesseract.get_languages())
          if not {"eng", "heb"}.issubset(languages):
              raise SystemExit(f"Missing OCR languages: {languages}")

          image = Image.new("RGB", (900, 180), "white")
          draw = ImageDraw.Draw(image)
          font_path = Path(r"C:\Windows\Fonts\arial.ttf")
          font = ImageFont.truetype(str(font_path), 64) if font_path.exists() else ImageFont.load_default()
          draw.text((30, 35), "APPLE RECIPE", fill="black", font=font)
          recognized = app.ocr_image(image).upper()
          if "APPLE" not in recognized:
              raise SystemExit(f"OCR recognition failed. Output: {recognized!r}")
          print("OCR OK: Hebrew and English data loaded; APPLE was recognized.")
          '@ | python -

      - name: בדיקת תקינות קוד ובדיקות יחידה
        run: |
          python -m py_compile "src/ספריית_המתכונים.py"
          python -m unittest discover -s tests -v

      - name: יצירת סמל התוכנה
        shell: pwsh
        run: |
          python assets/create_icon.py
          if (!(Test-Path "assets/app_icon.ico")) { throw "קובץ סמל התוכנה לא נוצר" }
          python -c "from PIL import Image; im=Image.open('assets/app_icon.ico'); im.load(); print('App icon:', im.format, im.size)"
      
      - name: יצירת קובץ הפעלה יחיד בעברית
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --icon "assets/app_icon.ico"
          --add-data "assets/app_icon.ico;assets"
          --name "ספריית_המתכונים_שלי"
          --collect-all fitz
          --collect-all PIL
          --collect-all tkinterdnd2
          --collect-all pytesseract
          --add-data "tesseract;tesseract"
          --hidden-import striprtf.striprtf
          --hidden-import docx
          "src/ספריית_המתכונים.py"

      - name: בדיקה שקובץ ההפעלה נוצר
        shell: pwsh
        run: |
          $exe = "dist/ספריית_המתכונים_שלי.exe"
          if (!(Test-Path $exe)) { throw "קובץ ההפעלה לא נוצר" }
          $file = Get-Item $exe
          if ($file.Length -lt 5000000) { throw "קובץ ההפעלה קטן מהצפוי" }
          Write-Host "נוצר קובץ הפעלה בגודל $($file.Length) בתים"


      - name: יצירת חבילה עצמאית עם מנוע תצוגת Office
        shell: pwsh
        run: |
          $exe = "dist/ספריית_המתכונים_שלי.exe"
          $loSource = Join-Path $env:ProgramFiles 'LibreOffice'
          if (!(Test-Path (Join-Path $loSource 'program/soffice.exe'))) {
            $loSource = Join-Path ${env:ProgramFiles(x86)} 'LibreOffice'
          }
          if (!(Test-Path (Join-Path $loSource 'program/soffice.exe'))) { throw "LibreOffice folder missing" }

          $packageRoot = "dist/חבילת-ספריית-המתכונים"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          New-Item -ItemType Directory -Force -Path "$packageRoot/LibreOffice" | Out-Null
          Copy-Item $exe "$packageRoot/"
          Copy-Item "$loSource/*" "$packageRoot/LibreOffice/" -Recurse -Force

          $soffice = "$packageRoot/LibreOffice/program/soffice.com"
          if (!(Test-Path $soffice)) { $soffice = "$packageRoot/LibreOffice/program/soffice.exe" }
          if (!(Test-Path $soffice)) { throw "Bundled LibreOffice executable missing" }
          & $soffice --headless --version
          if ($LASTEXITCODE -ne 0) { throw "Bundled LibreOffice failed its startup check" }

          @'
          הפעלת ספריית המתכונים שלי
          1. חלצו את כל תוכן קובץ ה-ZIP לתיקייה במחשב.
          2. השאירו את קובץ ההפעלה ואת תיקיית LibreOffice באותה תיקייה.
          3. הפעילו את ספריית_המתכונים_שלי.exe.
          תצוגת Word, Excel ו-PowerPoint מופעלת מתוך התוכנה, ללא פתיחת חלון LibreOffice.
          ספרים דיגיטליים נתמכים נפתחים בתצוגה פנימית.
          '@ | Set-Content -Encoding UTF8 "$packageRoot/קראו-לפני-הפעלה.txt"

          $zip = "dist/ספריית-המתכונים-שלי-Windows-כולל-תצוגת-Office.zip"
          Compress-Archive -Path "$packageRoot/*" -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "Portable package ZIP was not created" }
          $size = (Get-Item $zip).Length
          if ($size -lt 50000000) { throw "Portable package is unexpectedly small: $size bytes" }
          Write-Host "Portable package created: $size bytes"

      - name: בדיקת מנוע התצוגה מתוך החבילה
        shell: pwsh
        run: |
          @'
          import sys
          from pathlib import Path
          import tempfile
          sys.path.insert(0, "src")
          import ספריית_המתכונים as app

          bundle = Path("dist/חבילת-ספריית-המתכונים").resolve()
          executable = bundle / "ספריית_המתכונים_שלי.exe"
          sys.frozen = True
          sys.executable = str(executable)
          engine = app.find_libreoffice()
          if engine is None or not engine.exists():
              raise SystemExit("Bundled LibreOffice was not discovered next to the EXE")

          with tempfile.TemporaryDirectory() as temp:
              source = Path(temp) / "בדיקת-חבילה.docx"
              doc = app.Document()
              doc.add_paragraph("BUNDLED OFFICE ENGINE CHECK")
              doc.save(source)
              pdf, temp_dir, error = app.convert_office_to_pdf(source)
              if error or pdf is None or not pdf.is_file():
                  raise SystemExit(f"Bundled Office conversion failed: {error}")
              with app.fitz.open(pdf) as converted:
                  if converted.page_count < 1:
                      raise SystemExit("Bundled conversion returned an empty PDF")
              import shutil
              shutil.rmtree(temp_dir, ignore_errors=True)
          print("Bundled Office conversion passed.")
          '@ | python -

      - name: בדיקת פתיחה של התוכנה מהחבילה
        shell: pwsh
        run: |
          $exe = "dist/חבילת-ספריית-המתכונים/ספריית_המתכונים_שלי.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "The packaged application exited during startup" }
          Stop-Process -Id $process.Id -Force
          Write-Host "Packaged app launch check passed."

      - name: שמירת קובץ ההפעלה להורדה
        uses: actions/upload-artifact@v4
        with:
          name: ספריית-המתכונים-שלי-Windows
          path: dist/ספריית_המתכונים_שלי.exe
          if-no-files-found: error
          retention-days: 30

      - name: שמירת חבילת Windows מלאה להורדה
        uses: actions/upload-artifact@v4
        with:
          name: ספריית-המתכונים-שלי-Windows-כולל-Office
          path: dist/ספריית-המתכונים-שלי-Windows-כולל-תצוגת-Office.zip
          if-no-files-found: error
          retention-days: 30
