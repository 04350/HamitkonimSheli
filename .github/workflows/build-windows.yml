name: בניית התוכנה למחשב

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build-windows.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: הורדת קובצי הפרויקט
        uses: actions/checkout@v4

      - name: התקנת סביבת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות הדרושות לבנייה
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF python-docx striprtf pillow tkinterdnd2 pyinstaller

      - name: בדיקת תקינות קוד ובדיקות יחידה
        run: |
          python -m py_compile "src/ספריית_המתכונים.py"
          python -m unittest discover -s tests -v

      - name: יצירת קובץ הפעלה יחיד בעברית
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "ספריית_המתכונים_שלי"
          --collect-all fitz
          --collect-all PIL
          --collect-all tkinterdnd2
          --hidden-import striprtf.striprtf
          --hidden-import docx
          "src/ספריית_המתכונים.py"

      - name: בדיקה שקובץ ההפעלה נוצר
        shell: pwsh
        run: |
          $exe = "dist/ספריית_המתכונים_שלי.exe"
          if (!(Test-Path $exe)) { throw "קובץ ההפעלה לא נוצר" }
          $file = Get-Item $exe
          if ($file.Length -lt 5000000) { throw "קובץ ההפעלה קטן מהצפוי" }
          Write-Host "נוצר קובץ הפעלה בגודל $($file.Length) בתים"

      - name: בדיקת פתיחה של התוכנה
        shell: pwsh
        run: |
          $exe = "dist/ספריית_המתכונים_שלי.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "התוכנה נסגרה מיד לאחר ההפעלה" }
          Stop-Process -Id $process.Id -Force
          Write-Host "בדיקת הפעלה עברה בהצלחה"

      - name: שמירת קובץ ההפעלה להורדה
        uses: actions/upload-artifact@v4
        with:
          name: ספריית-המתכונים-שלי-Windows
          path: dist/ספריית_המתכונים_שלי.exe
          if-no-files-found: error
          retention-days: 30
