name: בניית התוכנה למחשב

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/build-windows.yml'
      - 'tests/**'
      - 'assets/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: הורדת קובצי הפרויקט
        uses: actions/checkout@v4

      - name: התקנת סביבת פייתון
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות הדרושות לבנייה
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF==1.26.7 python-docx striprtf pillow tkinterdnd2 pytesseract openpyxl python-pptx pyinstaller
          choco install tesseract --no-progress -y
          choco install libreoffice-still --no-progress -y
          $loSource = Join-Path $env:ProgramFiles 'LibreOffice'
          if (!(Test-Path (Join-Path $loSource 'program/soffice.exe'))) {
            $loSource = Join-Path ${env:ProgramFiles(x86)} 'LibreOffice'
          }
          if (!(Test-Path (Join-Path $loSource 'program/soffice.exe'))) {
            throw 'LibreOffice was not installed in the expected location'
          }
          Write-Host "LibreOffice engine found at $loSource"
          New-Item -ItemType Directory -Force -Path tesseract/tessdata | Out-Null
          Copy-Item 'C:\Program Files\Tesseract-OCR\tesseract.exe' tesseract/
          Copy-Item 'C:\Program Files\Tesseract-OCR\*.dll' tesseract/ -ErrorAction SilentlyContinue
          Copy-Item 'C:\Program Files\Tesseract-OCR\tessdata\eng.traineddata' tesseract/tessdata/
          Invoke-WebRequest -Uri 'https://github.com/tesseract-ocr/tessdata_best/raw/main/heb.traineddata' -OutFile 'tesseract/tessdata/heb.traineddata'
          # The extra Hebrew model is pinned to an upstream commit and SHA-256
          # verified here. The model is bundled into the app; users never download it.
          $heb4Uri = 'https://raw.githubusercontent.com/boro11204/hebrew-ocr-offline/30ae3e5513d5c132ecdfeb03730fa0b723a2180f/models/heb4.traineddata'
          Invoke-WebRequest -Uri $heb4Uri -OutFile 'tesseract/tessdata/heb4.traineddata'
          $expectedHeb4Sha256 = 'a1422a71e9e7d060b5cc0c08e3060cc5e7a9a9ea41ecc0da43ec07d8946769a6'
          $actualHeb4Sha256 = (Get-FileHash 'tesseract/tessdata/heb4.traineddata' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHeb4Sha256 -ne $expectedHeb4Sha256) { throw "heb4.traineddata checksum mismatch: $actualHeb4Sha256" }
          Copy-Item 'licenses/APACHE-2.0.txt' 'tesseract/tessdata/'
          Copy-Item 'licenses/HEBREW-OCR-MODEL-NOTICE.txt' 'tesseract/tessdata/'

      - name: בדיקת מנוע OCR בעברית ובאנגלית
        shell: pwsh
        run: |
          @'
          import sys
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          sys.path.insert(0, "src")
          import ספריית_המתכונים as app

          root = Path("tesseract").resolve()
          minimum_sizes = {
              "eng.traineddata": 100_000,
              "heb.traineddata": 2_500_000,
              "heb4.traineddata": 3_500_000,
          }
          for required, minimum_size in minimum_sizes.items():
              data_file = root / "tessdata" / required
              if not data_file.exists() or data_file.stat().st_size < minimum_size:
                  raise SystemExit(f"Missing or invalid language data: {data_file}")
          for notice in ("APACHE-2.0.txt", "HEBREW-OCR-MODEL-NOTICE.txt"):
              if not (root / "tessdata" / notice).is_file():
                  raise SystemExit(f"Missing bundled OCR model attribution: {notice}")
          if not app.configure_ocr():
              raise SystemExit("Tesseract was not found by the application")
          languages = set(app.pytesseract.get_languages())
          if not {"eng", "heb"}.issubset(languages):
              raise SystemExit(f"Missing base OCR languages: {languages}")
          print(f"Tesseract advertised languages: {sorted(languages)}")
          # Some fine-tuned models carry an internal language identifier that
          # differs from their filename, so validate the actual explicit model call
          # below instead of requiring a particular --list-langs display name.

          image = Image.new("RGB", (900, 180), "white")
          draw = ImageDraw.Draw(image)
          font_path = Path(r"C:\Windows\Fonts\arial.ttf")
          font = ImageFont.truetype(str(font_path), 64) if font_path.exists() else ImageFont.load_default()
          draw.text((30, 35), "APPLE RECIPE", fill="black", font=font)
          recognized = app.ocr_image(image).upper()
          if "APPLE" not in recognized:
              raise SystemExit(f"OCR recognition failed. Output: {recognized!r}")
          hebrew_image = Image.new("RGB", (1200, 220), "white")
          hebrew_draw = ImageDraw.Draw(hebrew_image)
          hebrew_text = "עוגת תפוחים"
          try:
              hebrew_draw.text((30, 35), hebrew_text, fill="black", font=font, direction="rtl")
          except (TypeError, ValueError, KeyError):
              # Fallback for Pillow builds without the optional RTL layout engine.
              hebrew_draw.text((30, 35), hebrew_text[::-1], fill="black", font=font)
          recognized_hebrew = app.ocr_image(hebrew_image)
          recognized_heb4 = app.pytesseract.image_to_string(
              hebrew_image, lang="heb4+eng", config="--oem 3 --psm 6", timeout=35
          )
          hebrew_image.close()
          hebrew_count = sum(1 for char in recognized_hebrew if "א" <= char <= "ת")
          heb4_count = sum(1 for char in recognized_heb4 if "א" <= char <= "ת")
          if hebrew_count < 6:
              raise SystemExit(f"Hebrew OCR recognition failed. Output: {recognized_hebrew!r}")
          if heb4_count < 6:
              raise SystemExit(f"Additional Hebrew OCR model failed. Output: {recognized_heb4!r}")
          print(f"OCR OK: English, Hebrew and heb4 model recognized ({hebrew_count}/{heb4_count} Hebrew letters).")
          '@ | python -

      - name: בדיקת תקינות קוד ובדיקות יחידה
        run: |
          python -m py_compile "src/ספריית_המתכונים.py"
          python -m unittest discover -s tests -v

      - name: יצירת סמל התוכנה
        shell: pwsh
        run: |
          python assets/create_icon.py
          if (!(Test-Path "assets/app_icon.ico")) { throw "קובץ סמל התוכנה לא נוצר" }
          python -c "from PIL import Image; im=Image.open('assets/app_icon.ico'); im.load(); print('App icon:', im.format, im.size)"
      
      - name: יצירת קובץ הפעלה יחיד בעברית
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --icon "assets/app_icon.ico"
          --add-data "assets/app_icon.ico;assets"
          --name "ספריית_המתכונים_שלי"
          --collect-all fitz
          --collect-all PIL
          --collect-all tkinterdnd2
          --collect-all pytesseract
          --add-data "tesseract;tesseract"
          --hidden-import striprtf.striprtf
          --hidden-import docx
          "src/ספריית_המתכונים.py"

      - name: בדיקה שקובץ ההפעלה נוצר
        shell: pwsh
        run: |
          $exe = "dist/ספריית_המתכונים_שלי.exe"
          if (!(Test-Path $exe)) { throw "קובץ ההפעלה לא נוצר" }
          $file = Get-Item $exe
          if ($file.Length -lt 5000000) { throw "קובץ ההפעלה קטן מהצפוי" }
          Write-Host "נוצר קובץ הפעלה בגודל $($file.Length) בתים"


      - name: יצירת חבילה קומפקטית עם ארכיון Office יחיד
        shell: pwsh
        run: |
          $exe = "dist/ספריית_המתכונים_שלי.exe"
          $loSource = Join-Path $env:ProgramFiles 'LibreOffice'
          if (!(Test-Path (Join-Path $loSource 'program/soffice.exe'))) {
            $x86 = [Environment]::GetEnvironmentVariable('ProgramFiles(x86)')
            $loSource = Join-Path $x86 'LibreOffice'
          }
          if (!(Test-Path (Join-Path $loSource 'program/soffice.exe'))) { throw "LibreOffice folder missing" }
          $loVersionInfo = (Get-Item (Join-Path $loSource 'program/soffice.exe')).VersionInfo
          $loVersion = [string]$loVersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($loVersion)) { $loVersion = [string]$loVersionInfo.FileVersion }
          if ([string]::IsNullOrWhiteSpace($loVersion)) { throw "LibreOffice version could not be determined" }
          Write-Host "Bundling LibreOffice version $loVersion"

          $packageRoot = "dist/חבילת-ספריית-המתכונים"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Copy-Item $exe "$packageRoot/"

          # Store the entire Office runtime in one nested archive. Extracting
          # the main ZIP now produces three files rather than thousands.
          $loArchive = Join-Path $packageRoot "LibreOffice.zip"
          @'
          import sys
          import zipfile
          from pathlib import Path

          source = Path(sys.argv[1])
          target = Path(sys.argv[2])
          bundle_version = sys.argv[3].strip()
          if not bundle_version:
              raise SystemExit("LibreOffice version marker is empty")
          count = 0
          with zipfile.ZipFile(target, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=4, allowZip64=True) as archive:
              for path in source.rglob("*"):
                  if path.is_file():
                      archive.write(path, path.relative_to(source).as_posix())
                      count += 1
              archive.writestr(".recipe-library-version", bundle_version)
          if count < 1000:
              raise SystemExit(f"Unexpectedly few Office runtime files: {count}")
          print(f"Packed {count} LibreOffice files plus a version marker into one archive.")
          '@ | python - "$loSource" "$loArchive" "$loVersion"
          if (!(Test-Path $loArchive)) { throw "LibreOffice.zip was not created" }

          @'
          הפעלת ספריית המתכונים שלי
          1. חלצו את קובץ ה-ZIP הראשי לתיקייה במחשב.
          2. השאירו את קובץ ההפעלה ואת LibreOffice.zip באותה תיקייה.
          3. הפעילו את ספריית_המתכונים_שלי.exe.
          אין צורך לחלץ את LibreOffice.zip. התוכנה תפרוס אותו אוטומטית לתיקיית הנתונים המקומית רק בפעם הראשונה שתצוגת Office או יצירת PDF יידרשו.
          '@ | Set-Content -Encoding UTF8 "$packageRoot/קראו-לפני-הפעלה.txt"

          $looseFiles = @(Get-ChildItem -LiteralPath $packageRoot -File).Count
          $looseDirectories = @(Get-ChildItem -LiteralPath $packageRoot -Directory).Count
          if ($looseFiles -ne 3 -or $looseDirectories -ne 0) {
            throw "Package should have exactly 3 top-level files and no runtime folders; got $looseFiles files, $looseDirectories directories"
          }

          $zip = "dist/ספריית-המתכונים-שלי-Windows-כולל-תצוגת-Office.zip"
          Compress-Archive -Path "$packageRoot/*" -DestinationPath $zip -CompressionLevel Optimal
          if (!(Test-Path $zip)) { throw "Portable package ZIP was not created" }
          $size = (Get-Item $zip).Length
          if ($size -lt 50000000) { throw "Portable package is unexpectedly small: $size bytes" }
          Write-Host "Compact package created: $size bytes; extracted layout contains exactly 3 files."

      - name: בדיקת מנוע התצוגה מתוך החבילה
        shell: pwsh
        run: |
          @'
          import sys
          from pathlib import Path
          import tempfile
          sys.path.insert(0, "src")
          import ספריית_המתכונים as app

          import os
          bundle = Path("dist/חבילת-ספריית-המתכונים").resolve()
          executable = bundle / "ספריית_המתכונים_שלי.exe"
          archive = bundle / "LibreOffice.zip"
          if not archive.is_file() or (bundle / "LibreOffice").exists():
              raise SystemExit("Package must contain LibreOffice.zip and no loose LibreOffice folder")
          local_data = tempfile.TemporaryDirectory(prefix="recipe-local-data-")
          os.environ["LOCALAPPDATA"] = local_data.name
          sys.frozen = True
          sys.executable = str(executable)
          engine = app.find_libreoffice()
          if engine is None or not engine.exists():
              raise SystemExit("LibreOffice.zip was not extracted/discovered")
          if engine.parent.name.lower() != "program":
              raise SystemExit("Extracted Office executable has an unexpected path")

          with tempfile.TemporaryDirectory() as temp:
              source = Path(temp) / "בדיקת-חבילה.docx"
              doc = app.Document()
              doc.add_paragraph("BUNDLED OFFICE ENGINE CHECK")
              doc.save(source)
              pdf, temp_dir, error = app.convert_office_to_pdf(source)
              if error or pdf is None or not pdf.is_file():
                  raise SystemExit(f"Bundled Office conversion failed: {error}")
              with app.fitz.open(pdf) as converted:
                  if converted.page_count < 1:
                      raise SystemExit("Bundled conversion returned an empty PDF")
              import shutil
              shutil.rmtree(temp_dir, ignore_errors=True)
          local_data.cleanup()
          print("Bundled Office ZIP extraction and conversion passed.")
          '@ | python -

      - name: בדיקת פתיחה של התוכנה מהחבילה
        shell: pwsh
        run: |
          $exe = "dist/חבילת-ספריית-המתכונים/ספריית_המתכונים_שלי.exe"
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) { throw "The packaged application exited during startup" }
          taskkill /PID $process.Id /T /F | Out-Null
          Write-Host "Packaged app launch check passed and process tree was stopped."


      - name: שמירת קובץ ההפעלה להורדה
        uses: actions/upload-artifact@v4
        with:
          name: ספריית-המתכונים-שלי-Windows
          path: dist/ספריית_המתכונים_שלי.exe
          if-no-files-found: error
          retention-days: 30

      - name: שמירת חבילת Windows מלאה להורדה
        uses: actions/upload-artifact@v4
        with:
          name: ספריית-המתכונים-שלי-Windows-כולל-Office
          path: dist/ספריית-המתכונים-שלי-Windows-כולל-תצוגת-Office.zip
          if-no-files-found: error
          retention-days: 30

  capture-screenshot:
    name: הרצה שנייה – צילום מסך לאחר בדיקות תקינות
    needs: build-windows
    runs-on: windows-latest
    steps:
      - name: הורדת קובצי הפרויקט
        uses: actions/checkout@v4

      - name: התקנת סביבת פייתון לצילום
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: התקנת ספריות להצגת נתוני ההדגמה
        run: |
          python -m pip install --upgrade pip
          python -m pip install PyMuPDF==1.26.7 python-docx striprtf pillow tkinterdnd2 pytesseract openpyxl python-pptx

      - name: הורדת חבילת Windows מההרצה הראשונה
        uses: actions/download-artifact@v4
        with:
          name: ספריית-המתכונים-שלי-Windows-כולל-Office
          path: artifacts

      - name: חילוץ חבילת התוכנה
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath "artifacts" -Filter "*.zip" -File | Select-Object -First 1
          if (!$archive) { throw "The verified Windows package was not found." }
          $packageRoot = "dist/חבילת-ספריית-המתכונים"
          New-Item -ItemType Directory -Force -Path $packageRoot | Out-Null
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $packageRoot -Force
          $exe = Join-Path $packageRoot "ספריית_המתכונים_שלי.exe"
          if (!(Test-Path $exe)) { throw "The application executable is missing from the verified package." }
          if (!(Test-Path (Join-Path $packageRoot "LibreOffice.zip"))) { throw "LibreOffice.zip is missing from the verified package." }

      - name: הרצת התוכנה מחדש וצילום מסך אמיתי
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "recipe-ui-demo-profile"
          $env:PYTHONIOENCODING = "utf-8"
          $env:PYTHONUTF8 = "1"
          python scripts/create_ui_demo_data.py
          if ($LASTEXITCODE -ne 0) { throw "Demo library creation failed." }

          $exe = "dist/חבילת-ספריית-המתכונים/ספריית_המתכונים_שלי.exe"
          $process = Start-Process -FilePath $exe -PassThru
          try {
            Start-Sleep -Seconds 12
            python scripts/capture_app_screenshot.py --output "dist/recipe-library-real-ui.png" --process-id $process.Id --expected-items 6
            if ($LASTEXITCODE -ne 0) { throw "Real application screenshot validation failed." }
            $shot = Get-Item "dist/recipe-library-real-ui.png" -ErrorAction Stop
            if ($shot.Length -lt 100000) { throw "Real application screenshot is unexpectedly small." }
            Write-Host "Verified real app screenshot: $($shot.Length) bytes."
          } finally {
            if ($process -and !$process.HasExited) {
              taskkill /PID $process.Id /T /F | Out-Null
            }
          }

      - name: צילום מסך אמיתי של הממשק מתוך Windows – שמירת התוצר
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: צילום-מסך-אמיתי-של-התוכנה
          path: dist/recipe-library-real-ui.png
          if-no-files-found: error
          retention-days: 30
