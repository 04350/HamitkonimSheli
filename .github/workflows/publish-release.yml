name: פרסום חבילת Windows להורדה ישירה

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: מזהה הרצת הבנייה שממנה מורידים את החבילה
        required: true
        default: "42034577443"
        type: string
  workflow_run:
    workflows: ["בניית התוכנה למחשב"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha)
    runs-on: ubuntu-latest
    steps:
      - name: הורדת החבילה המלאה מהרצת הבנייה
        uses: actions/download-artifact@v4
        with:
          name: ספריית-המתכונים-שלי-Windows-כולל-Office
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}

      - name: הכנת קובץ בשם נוח לקישור
        shell: bash
        run: |
          source_file="release-assets/ספריית-המתכונים-שלי-Windows-כולל-תצוגת-Office.zip"
          if [ ! -f "$source_file" ]; then
            echo "לא נמצא קובץ החבילה שהורד מההרצה"
            find release-assets -maxdepth 2 -type f -print
            exit 1
          fi
          cp "$source_file" recipe-library-windows-office.zip
          ls -lh recipe-library-windows-office.zip

      - name: פרסום או עדכון Release עם קובץ ההורדה
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.4.0
          name: ספריית המתכונים שלי – Windows v1.4.0
          target_commitish: main
          body: |
            גרסה 1.4.0 של ספריית המתכונים שלי.

            - תצוגת מתכון מקצועית: מצרכים, הוראות הכנה, זמנים, מספר מנות והערות.
            - חילוץ אוטומטי של שורות מצרכים מתוך טקסט הקובץ.
            - מחשבון כמויות לשינוי מספר המנות.
            - תצוגה מקדימה לעמוד הראשון של PDF, מסמכי Office וספרים דיגיטליים, בנוסף לתמונות ולקובצי טקסט.
            - חיפוש וסינון מתקדם לפי סוג קובץ, תאריך, קטגוריה ותגיות.
            - מיון לפי שם, תאריך, סוג, גודל ותאריך צפייה אחרון.
            - איתור קבצים ומתכונים דומים לפי שם ותוכן, ללא מחיקה אוטומטית.
            - סל מחזור עם שחזור פריטים ומחיקה לצמיתות לפי בחירה.
            - יצירה ושחזור של גיבוי מלא.
            - גיבוי אוטומטי מתוזמן, עם שמירת חמשת הגיבויים האחרונים.
            - קיצורי מקלדת: Ctrl+F לחיפוש, Ctrl+O לפתיחה ו-Ctrl+B לגיבוי.
            - סרגל התקדמות בזמן ייבוא קבצים.
            - הגדרות לתבנית צבעים, גודל גופן וגודל תצוגה מקדימה.
            - שמירת הנתונים מקומית ושדרוג אוטומטי של מסדי נתונים קיימים.
            
            לאחר חילוץ ה-ZIP יש להשאיר את קובץ ההפעלה ואת תיקיית LibreOffice יחד.
          files: recipe-library-windows-office.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
