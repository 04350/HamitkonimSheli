name: פרסום חבילת Windows להורדה ישירה

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: מזהה הרצת הבנייה שממנה מורידים את החבילה
        required: true
        default: "42071677897"
        type: string
  workflow_run:
    workflows: ["בניית התוכנה למחשב"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-latest-windows-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: בדיקת הקומיט העדכני בענף הראשי
        if: github.event_name == 'workflow_run'
        id: current
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: מניעת פרסום בנייה ישנה
        if: github.event_name == 'workflow_run'
        id: latest_check
        shell: bash
        run: |
          current_sha="$(git rev-parse HEAD)"
          source_sha="${{ github.event.workflow_run.head_sha }}"
          if [ "$current_sha" = "$source_sha" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit is already on main; skipping this older build."
          fi

      - name: הורדת החבילה המלאה מהרצת הבנייה
        if: github.event_name == 'workflow_dispatch' || steps.latest_check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ספריית-המתכונים-שלי-Windows-כולל-Office
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}

      - name: הכנת קובץ בשם נוח לקישור
        if: github.event_name == 'workflow_dispatch' || steps.latest_check.outputs.publish == 'true'
        shell: bash
        run: |
          source_file="release-assets/ספריית-המתכונים-שלי-Windows-כולל-תצוגת-Office.zip"
          if [ ! -f "$source_file" ]; then
            echo "לא נמצא קובץ החבילה שהורד מההרצה"
            find release-assets -maxdepth 2 -type f -print
            exit 1
          fi
          cp "$source_file" recipe-library-windows-office.zip
          ls -lh recipe-library-windows-office.zip

      - name: פרסום או עדכון Release עם קובץ ההורדה
        if: github.event_name == 'workflow_dispatch' || steps.latest_check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.11.0
          name: ספריית המתכונים שלי – Windows v1.11.0
          target_commitish: main
          body: |
            גרסה 1.11.0 של ספריית המתכונים שלי.

            - מסכי הכלים נפתחים בתוך אזור העבודה של החלון הראשי; סרגל הצד נשאר קבוע.
            - חלונית הקריאה ניתנת לגרירה ולשינוי רוחב, והרוחב נשמר.
            - מעבר בין תצוגת המקור לבין הטקסט שחולץ; התמונה מוצגת בשלמותה ללא חיתוך.
            - חלוניות מעוגלות יותר בסורק המתכונים.
            - צילום מסך אמיתי של הממשק נבדק בבניית Windows עם נתוני הדגמה.
            - עיצוב בית חדש בסגנון מודרני: כרטיסים מעוגלים, צללים עדינים, כפתורים מעוצבים וניווט מינימליסטי.
            - גלריית מתכונים מדורגת: 60 פריטים תחילה, ואז טעינה של 48 נוספים בכל פעם כדי לצמצם עומס בממשק.
            - כפתור הוספת מתכון בולט במסך הבית וחלונית קריאה בעלת משטח מעוגל.
            - מסכי מרכז המתכונים, סורק OCR, הגדרות, סל המחזור, עורך המתכון, תצוגת הקבצים והייבוא מוצגים בתוך החלון הראשי — ללא חלונות תוכנה נפרדים.
            - חלונית הקריאה ניתנת להרחבה ולצמצום בגרירה, ורוחבה נשמר בין הפעלות.
            - אפשר לעבור בחלונית בין תמונת המקור לבין הטקסט שחולץ ב-OCR.
            - תצוגת קובץ מלאה מאפשרת להחליף בין התמונה/המסמך המקורי לבין הטקסט שחולץ.
            - הבנייה מנסה להפיק צילום מסך אמיתי של הממשק מתוך Windows עם ספריית דוגמה.
            - ייבוא תיקיות ברקע: הממשק נשאר מגיב, מוצגת התקדמות, ואפשר לבטל את הייבוא.
            - OCR חסכוני בזיכרון: הקטנת תמונות גדולות לפני המרה ל-RGB וניסיונות זיהוי חוזרים רק כאשר התוצאה הראשונית חלשה.
            - חבילת Windows קומפקטית: LibreOffice נמצא בקובץ LibreOffice.zip יחיד ונפרס אוטומטית רק בעת שימוש ראשון בתצוגת Office או ביצירת PDF.
            - גלריית מתכונים מרווחת יותר וחלונית קריאה לצד סרגל הניווט.
            - ערכות עיצוב חדשות: שמנת, מרווה ולילה.
            - שיפור OCR: עיבוד תמונה, ניתוח תיבות טקסט ובחירת כותרת לפי גובה האותיות ורמת הביטחון.
            - סורק מתכונים ייעודי עם תצוגת המקור, עריכת כותרת/מצרכים/הוראות ואישור לפני שמירה.
            - ניתוח גודל גופן מתוך שכבת טקסט של PDF לזיהוי כותרת מדויק יותר.

            תכונות מגרסה 1.6.0:

            - שימור מלא של מבנה תיקיות ותתי־תיקיות בייבוא תיקייה, כולל סינון לפי תיקיית המקור.
            - שינוי שם לפריטים תוך שמירה על התיקייה המקורית.
            - הדפסה מקצועית עם תצוגה מקדימה, עיצובים קלאסי/אלגנטי/פשוט, תמונות, תוכן חוברת ומספרי עמודים.
            - שלוש פריסות הדפסה: עמוד לכל מתכון, קומפקטי וכרטיסים קטנים.
            - מצב בישול עם כמה טיימרים במקביל, סימון שלבים וגודל טקסט משתנה.
            - ניהול קבוצתי של קטגוריות ותגיות ובחירה מרובה של פריטים.
            - סינון מתכונים בלבד, מסמכים וקבצים, ומתכונים שחסרים בהם פרטים.
            - דירוג אישי, כרטיס מתכון עשיר, תמונות והיסטוריית הכנה.
            - שמירת גרסאות מתכון והשוואת מצרכים והוראות.
            - ייבוא חכם של מצרכים והוראות מתוך טקסט, עם אפשרות בדיקה ועריכה.
            - מרכז המתכונים נשאר בחלון נפרד כדי לשמור על מסך הספרייה הראשי נקי.
            - כל הנתונים נשמרים מקומית במחשב, ללא חיבור רשת מצד התוכנה.

            לאחר חילוץ ה-ZIP הראשי, השאירו את קובץ ההפעלה ואת LibreOffice.zip באותה תיקייה. אין צורך לחלץ את LibreOffice.zip; התוכנה תפרוס אותו אוטומטית בעת הצורך.
          files: recipe-library-windows-office.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
