name: פרסום חבילת Windows להורדה ישירה

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: מזהה הרצת הבנייה שממנה מורידים את החבילה
        required: true
        default: "42034577443"
        type: string
  workflow_run:
    workflows: ["בניית התוכנה למחשב"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: הורדת החבילה המלאה מהרצת הבנייה
        uses: actions/download-artifact@v4
        with:
          name: ספריית-המתכונים-שלי-Windows-כולל-Office
          path: release-assets
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.source_run_id || github.event.workflow_run.id }}

      - name: הכנת קובץ בשם נוח לקישור
        shell: bash
        run: |
          source_file="release-assets/ספריית-המתכונים-שלי-Windows-כולל-תצוגת-Office.zip"
          if [ ! -f "$source_file" ]; then
            echo "לא נמצא קובץ החבילה שהורד מההרצה"
            find release-assets -maxdepth 2 -type f -print
            exit 1
          fi
          cp "$source_file" recipe-library-windows-office.zip
          ls -lh recipe-library-windows-office.zip

      - name: פרסום או עדכון Release עם קובץ ההורדה
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: ספריית המתכונים שלי – Windows v1.2.0
          target_commitish: main
          body: |
            גרסה 1.2.0 של ספריית המתכונים שלי.

            - ממשק משתמש מעוצב ומחודש בעברית.
            - אזור תצוגה מקדימה גדול יותר לתמונות.
            - חלוקה נוחה יותר בין רשימת הקבצים לתצוגה המקדימה.
            - הגדלת חלון הצפייה בתמונות ובמסמכים.
            - החבילה כוללת את מנוע התצוגה למסמכי Office.
            
            לאחר חילוץ ה-ZIP יש להשאיר את קובץ ההפעלה ואת תיקיית LibreOffice יחד.
          files: recipe-library-windows-office.zip
          overwrite_files: true
          fail_on_unmatched_files: true
          make_latest: true
